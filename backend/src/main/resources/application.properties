spring.application.name=wedflow-backend
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/wedflow}
spring.datasource.username=${DATABASE_USERNAME:wedflow}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.error.include-message=never
management.endpoints.web.exposure.include=health,info
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
server.error.include-stacktrace=never
server.error.include-binding-errors=never
