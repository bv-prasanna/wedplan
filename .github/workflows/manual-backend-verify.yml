name: Manual backend verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wedflow
          POSTGRES_PASSWORD: wedflow_test
          POSTGRES_DB: wedflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wedflow -d wedflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/wedflow
      DATABASE_USERNAME: wedflow
      DATABASE_PASSWORD: wedflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compile, test, coverage
        run: mvn -B --no-transfer-progress clean verify
      - name: Check JaCoCo output
        run: test -s target/site/jacoco/jacoco.xml
      - name: Upload reports on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wedflow-backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          retention-days: 3
          if-no-files-found: warn
